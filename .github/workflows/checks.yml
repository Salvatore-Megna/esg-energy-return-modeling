name: Scientific methodology tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  data-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify authentic source files
        run: python scripts/fetch_originals.py
      - name: Recompute leak-free holdout and Sharpe
        run: python src/esg_analysis.py
      - name: Save authenticated empirical outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esg-authentic-results
          path: outputs/*.csv
          retention-days: 30
