name: Review ESG bilingual report

on:
  push:
    branches:
      - review/esg-bilingual-report-20261104
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF verification library
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Compile the English LaTeX translation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report/en
      - name: Verify numerical tables and report dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import pymupdf

          original = Path("report/main.tex").read_text(encoding="utf-8")
          translation = Path("report/en/main.tex").read_text(encoding="utf-8")
          rows = lambda s: re.findall(r"^\s*(?:2013--2016|2017--2020|2021--2024)\s*&.+?\\\\$", s, re.M)
          assert rows(original) == rows(translation)
          assert len(rows(translation)) == 9
          for tex in (original, translation):
              assert tex.count(r"\begin{table}") == 4
              assert tex.count(r"\[") == 1
          with pymupdf.open("report/report.pdf") as it, pymupdf.open("report/en/main.pdf") as en:
              assert len(it) == len(en) == 5, (len(it),len(en))
              assert all(abs(a.rect.width - b.rect.width) < 1 for a,b in zip(it,en))
              assert all(abs(a.rect.height - b.rect.height) < 1 for a,b in zip(it,en))
              text = "\n".join(p.get_text() for p in en)
              for s in ("ESG and Performance", "Random Forest", "Results", "Conclusions"):
                  assert s in text, s
          print("English ESG report: 5 A4 pages, all nine numerical rows unchanged.")
          PY
          cp report/en/main.pdf report/en/report.pdf
      - name: Save bilingual PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: esg-bilingual-review
          path: |
            report/report.pdf
            report/en/report.pdf
          retention-days: 7
      - name: Save validated English PDF on the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/en/report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: save verified English ESG report [skip ci]"
            git push origin HEAD:review/esg-bilingual-report-20261104
          fi
